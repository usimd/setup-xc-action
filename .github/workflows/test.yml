name: Example Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-custom-dir:
    runs-on: ubuntu-latest
    name: Test Custom Installation Directory
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build action
        run: npm run build

      - name: Setup XC8 with Custom Directory
        id: setup-xc8
        uses: ./
        with:
          compiler: 'xc8'
          version: '3.10'
          install-dir: '/usr/local/microchip'

      - name: Verify Custom Directory
        run: |
          echo "Install directory: ${{ steps.setup-xc8.outputs.install-dir }}"
          echo "Compiler path: ${{ steps.setup-xc8.outputs.compiler-path }}"
          test -d "${{ steps.setup-xc8.outputs.install-dir }}"
          test -d "${{ steps.setup-xc8.outputs.compiler-path }}"

  test-matrix:
    runs-on: ubuntu-latest
    name: Test Matrix Build (${{ matrix.compiler }} ${{ matrix.version }})
    strategy:
      matrix:
        include:
          - compiler: 'xc8'
            version: '3.10'
            binary: 'xc8-cc'
          - compiler: 'xc8'
            version: '4.00'
            binary: 'xc8-cc'
          - compiler: 'xc16'
            version: '2.10'
            binary: 'xc16-gcc'
          - compiler: 'xc32'
            version: '5.10'
            binary: 'xc32-gcc'
          - compiler: 'xc32'
            version: '6.00'
            binary: 'xc32-gcc'
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build action
        run: npm run build

      - name: Setup ${{ matrix.compiler }}
        uses: ./
        with:
          compiler: ${{ matrix.compiler }}
          version: ${{ matrix.version }}

      - name: Verify Installation
        run: |
          which ${{ matrix.binary }}
          ${{ matrix.binary }} --version


